# 石油科普智能体 · Nginx 认证接入示例（样例，需合并进现场 server block）
# ---------------------------------------------------------------------------
# 用途：让 Nginx 在交付业务 HTML 之前，先向 Node 认证服务发一个内部子请求
#      GET /api/auth/verify（204 = 已登录，401 = 未登录，503 = 认证服务不可用）。
#
# 前置检查（auth_request 是编译期模块，可能并非默认构建）：
#   nginx -V 2>&1 | tr ' ' '\n' | grep auth_request
#   若输出中没有 --with-http_auth_request_module：
#     - 升级/重编译 Nginx；或
#     - 采用等价方案：让 Node 进程直接托管受保护 HTML（见 docs/auth-deployment.md「无 auth_request 时」）。
#   绝不能用前端 JS 跳转替代服务端校验。
#
# 现场实际值请替换：server_name、root、listen、证书路径、Node 端口。
# 本样例假设：
#   - 站点根：/www/kepu（宿主机 /docker/nginx/www/kepu）
#   - Node：127.0.0.1:8790
#   - 只暴露 443（HTTP 跳转 80）
# ---------------------------------------------------------------------------

# —— HTTP 跳 HTTPS ——
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/nginx/certs/example.com.pem;
    ssl_certificate_key /etc/nginx/certs/example.com.key;

    root /www/kepu;
    index index.html;

    # 业务页面一律不缓存（认证状态变化后必须重新取）
    client_max_body_size 1m;

    # ——————————————————————————————————————————————
    # 1) 内部鉴权子请求：只允许 Nginx 自己访问，公网拿不到
    # ——————————————————————————————————————————————
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8790/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        # 覆盖写入真实客户端 IP；不追加、不透传客户端伪造的同名头
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # 未登录的 HTML → 统一去登录页（生产可直接进 /index.html，不依赖 next）
    location @login_redirect {
        return 302 /login.html;
    }

    # ——————————————————————————————————————————————
    # 2) 登录页公开；静态资源公开（不含任何密钥/用户数据）
    # ——————————————————————————————————————————————
    location = /login.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets/ {
        # CSS / JS / 图片 / 字体：公开可读，但不得放置敏感配置
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico {
        try_files $uri =404;
        expires 30d;
    }

    # ——————————————————————————————————————————————
    # 3) 受保护业务页面：与 server/protected-pages.json 保持一致
    #    /index.html /sandbox.html /explore.html /chapter.html /tower.html
    #    /ask.html /write.html /kb.html /videos.html /video.html /_spike-separator.html
    #    （tests/auth-pages.test.mjs 会校验清单一致性）
    # ——————————————————————————————————————————————
    location ~ ^/(?:index|sandbox|explore|chapter|tower|ask|write|kb|videos|video|_spike-separator)\.html$ {
        auth_request /_auth;
        error_page 401 = @login_redirect;
        # 认证服务异常时不要把业务页面当已登录交付
        error_page 500 502 503 504 =503 /auth-error.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # 首页（实际交付 /index.html）
    location = / {
        auth_request /_auth;
        error_page 401 = @login_redirect;
        error_page 500 502 503 504 =503 /auth-error.html;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # 任何未登记的 HTML 默认拒绝：新增页面必须同时更新本文件与 protected-pages.json
    location ~ \.html$ {
        return 404;
    }

    # 认证服务不可用时的静态提示页（不含业务数据，可公开）
    location = /auth-error.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # ——————————————————————————————————————————————
    # 4) API：完全交给 Node 鉴权，401 保持 JSON，不得改写为登录跳转
    # ——————————————————————————————————————————————
    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_intercept_errors off;
        proxy_buffering off;              # Dify SSE 必须流式透传
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # 其它静态文件（字体、模型等），不做认证
    location / {
        try_files $uri =404;
    }

    # 运行时数据目录绝不能出现在 Web 根下；这里再兜一层
    location ^~ /data/ { deny all; }
    location ^~ /server/ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
}
