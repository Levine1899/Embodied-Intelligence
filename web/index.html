<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>石油科普智能体</title>
<link rel="stylesheet" href="assets/site/tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#070a0c;color:var(--text);font-family:var(--font-sans);font-size:var(--fs-14);line-height:1.8;-webkit-font-smoothing:antialiased}
body::after{
  content:"";position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* ---------- 封面：纯视觉设备 + 右侧系统菜单 ---------- */
.cover{position:relative;min-height:100vh;overflow:hidden;isolation:isolate}
.stage{position:absolute;inset:0;z-index:0;cursor:grab;touch-action:none;overflow:hidden}
.stage:active{cursor:grabbing}
.stage video,.stage .poster{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;transform:translateX(-9%)}
.stage .poster{z-index:0}
.stage video{z-index:1;filter:saturate(.94) brightness(.96)}
.stage.no-video video{display:none}
.cover::after{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(7,10,12,.76) 0%,rgba(7,10,12,.05) 24%,rgba(7,10,12,.12) 56%,rgba(7,10,12,.9) 100%),
    linear-gradient(270deg,#070a0c 0%,rgba(7,10,12,.97) 11%,rgba(7,10,12,.86) 23%,rgba(7,10,12,.46) 38%,rgba(7,10,12,.08) 54%,rgba(7,10,12,0) 64%),
    linear-gradient(90deg,rgba(7,10,12,.74) 0%,rgba(7,10,12,.32) 24%,rgba(7,10,12,0) 46%);
}

/* ---------- 顶栏 ---------- */
.top{position:absolute;inset:0 0 auto 0;z-index:10;padding:26px 48px}
.top .wrap{width:auto;max-width:none;height:auto;margin:0;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:30px;height:30px;object-fit:contain;flex:none}
.brand__text{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--font-display);font-size:19px;font-weight:400;letter-spacing:.1em;line-height:1.2;white-space:nowrap}
.brand small{margin-top:5px;font-family:var(--font-mono);font-size:9px;letter-spacing:.24em;color:rgba(232,225,212,.5);white-space:nowrap}
.top .auth-user{padding-top:1px}

/* ---------- 右侧系统菜单 ---------- */
.rail-wrap{position:absolute;z-index:12;top:143px;left:66.7vw;right:auto;bottom:198px;width:250px;display:flex;flex-direction:column;align-items:stretch}
.rail-eyebrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 18px;padding-left:19px;font-size:11px;letter-spacing:.2em;color:rgba(232,225,212,.46)}
.rail-eyebrow span{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:rgba(232,225,212,.32)}
.rail{position:relative;display:flex;flex-direction:column;padding-left:19px;border-left:1px solid rgba(232,225,212,.18)}
.rail::before{content:"";position:absolute;left:-1px;top:0;width:1px;height:38px;background:linear-gradient(180deg,var(--accent),rgba(216,162,74,0))}
.rail__item{position:relative;display:flex;align-items:baseline;gap:12px;min-height:58px;padding:16px 0 15px;border-bottom:1px solid rgba(232,225,212,.11);color:rgba(232,225,212,.76);transition:color .18s,transform .18s}
.rail__item:last-of-type{border-bottom:0}
.rail__item:hover{color:var(--accent-2);transform:translateX(2px)}
.rail__item.is-active{color:var(--accent-2)}
.rail__item.is-active::before{content:"";position:absolute;left:-22px;top:23px;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(216,162,74,.65)}
.rail__num{font-family:var(--font-mono);font-size:14px;letter-spacing:.06em;color:rgba(232,225,212,.38)}
.rail__item.is-active .rail__num{color:var(--accent)}
.rail__label{font-size:21px;letter-spacing:.06em;line-height:1.25;white-space:nowrap}
.rail__item.is-active .rail__label{font-weight:500}
.rail__hint{margin-top:auto;padding:22px 0 0 19px;border-left:1px solid rgba(232,225,212,.18)}
.rail__pause{display:inline-flex;align-items:center;gap:9px;min-height:44px;border:0;background:none;padding:0;color:rgba(232,225,212,.55);font-size:12px;letter-spacing:.12em;cursor:pointer;transition:color .18s}
.rail__pause:hover{color:var(--accent-2)}
.rail__pause i{position:relative;display:inline-block;width:12px;height:12px;flex:none}
.rail__pause[aria-pressed="true"] i::before,
.rail__pause[aria-pressed="true"] i::after{content:"";position:absolute;top:1px;width:3px;height:10px;background:currentColor}
.rail__pause[aria-pressed="true"] i::before{left:1px}
.rail__pause[aria-pressed="true"] i::after{right:1px}
.rail__pause[aria-pressed="false"] i::before{content:"";position:absolute;left:2px;top:1px;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid currentColor}

/* ---------- 响应式 ---------- */
@media (max-width:1200px){
  .top{padding:24px 36px}
  .rail-wrap{left:auto;right:34px;top:132px;bottom:170px;width:176px}
}
@media (max-width:760px){
  .cover{min-height:100vh}
  .top{padding:20px}
  .top .wrap{flex-wrap:wrap;row-gap:12px}
  .brand b{font-size:17px}
  .brand small{display:none}
  .top .auth-user{margin-left:auto}
  .rail-wrap{left:auto;right:14px;top:150px;bottom:150px;width:42px}
  .rail-eyebrow,.rail__num{display:none}
  .rail{padding-left:0;border-left:0;align-items:flex-end;gap:4px}
  .rail__item{min-height:46px;border:0;padding:10px 0;justify-content:flex-end}
  .rail__label{writing-mode:vertical-rl;letter-spacing:.12em;font-size:13px;color:rgba(232,225,212,.64)}
  .rail__item.is-active::before{display:none}
  .rail__hint{padding:14px 0 0;border-left:0;margin-top:auto}
  .rail__pause{width:42px;justify-content:center;color:rgba(232,225,212,.62)}
  .rail__pause span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="assets/site/auth.css?v=4">
<script src="assets/site/auth-guard.js?v=1"></script>
</head>
<body>

<section class="cover" aria-label="首页封面">
  <div class="stage" id="stage" role="img" aria-label="常减压蒸馏装置三维模型，绕塔缓慢旋转；可拖动查看">
    <img class="poster" src="assets/tower/hero-poster.jpg" alt="">
    <video id="loop" muted loop playsinline preload="auto" poster="assets/tower/hero-poster.jpg">
      <source src="assets/tower/hero-loop.mp4?v=1" type="video/mp4">
    </video>
  </div>

  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="石油科普智能体首页">
        <img src="assets/science-logo.png" alt="中国石油">
        <span class="brand__text"><b>石油科普智能体</b><small>PETROLEUM · SCIENCE</small></span>
      </a>
    </div>
  </header>

  <nav class="rail-wrap" aria-label="站点导航">
    <p class="rail-eyebrow">站点导航 <span>MENU</span></p>
    <div class="rail">
      <a class="rail__item is-active" href="index.html" aria-current="page"><span class="rail__num">01</span><span class="rail__label">首页</span></a>
      <a class="rail__item" href="ask.html"><span class="rail__num">02</span><span class="rail__label">智能问答</span></a>
      <a class="rail__item" href="sandbox.html"><span class="rail__num">03</span><span class="rail__label">沉浸式讲解</span></a>
      <a class="rail__item" href="write.html"><span class="rail__num">04</span><span class="rail__label">科普文案</span></a>
      <a class="rail__item" href="videos.html"><span class="rail__num">05</span><span class="rail__label">科普视频</span></a>
    </div>
    <div class="rail__hint">
      <button id="toggle" class="rail__pause" type="button" aria-pressed="true" aria-label="暂停演示">
        <i aria-hidden="true"></i><span data-toggle-label>暂停演示</span>
      </button>
    </div>
  </nav>
</section>

<script>
(function () {
  var v = document.getElementById('loop');
  var stage = document.getElementById('stage');
  var btn = document.getElementById('toggle');
  if (!v || !stage || !btn) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dragging = false, sx = 0, st = 0, timer = null;

  function label(text) {
    var el = btn.querySelector('[data-toggle-label]');
    if (el) el.textContent = text; else btn.textContent = text;
    btn.setAttribute('aria-label', text);
  }
  function play() {
    if (reduce) return;
    v.play().catch(function () {});
    label('暂停演示');
    btn.setAttribute('aria-pressed', 'true');
  }
  function pause() {
    v.pause();
    label('播放演示');
    btn.setAttribute('aria-pressed', 'false');
  }

  v.addEventListener('error', function () { stage.classList.add('no-video'); });
  btn.addEventListener('click', function () { v.paused ? play() : pause(); });

  if (!reduce) play(); else pause();

  stage.addEventListener('pointerdown', function (e) {
    dragging = true; sx = e.clientX; st = v.currentTime || 0; pause();
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var r = stage.getBoundingClientRect();
    var dur = v.duration || 6;
    var t = (st - (e.clientX - sx) / r.width * dur) % dur;
    if (t < 0) t += dur;
    v.currentTime = t;
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    clearTimeout(timer);
    timer = setTimeout(function () { if (!dragging) play(); }, 1200);
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('pointerenter', function () { if (!dragging) v.pause(); });
  stage.addEventListener('pointerleave', function () { if (!dragging) play(); });
})();
</script>
<script src="float-chat.js?v=8"></script>
</body>
</html>
