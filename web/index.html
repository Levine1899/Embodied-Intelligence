<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>油见未来 · 石油科普智能体</title>
<link rel="stylesheet" href="assets/site/tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#070a0c;color:var(--text);font-family:var(--font-sans);font-size:var(--fs-14);line-height:1.8;-webkit-font-smoothing:antialiased}
body::after{
  content:"";position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:min(1220px,calc(100% - 80px));margin:0 auto}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- 封面 ---------- */
.cover{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.stage{position:absolute;inset:0;cursor:grab;touch-action:none}
.stage:active{cursor:grabbing}
.stage video,.stage .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%}
.stage .poster{z-index:0}
.stage video{z-index:1;filter:saturate(.96) brightness(1.02)}
.stage.no-video video{display:none}
.stage-ui{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-bottom:8px}
.stage-btn{background:rgba(8,12,14,.5);border:1px solid rgba(232,225,212,.42);color:var(--text);font-family:inherit;font-size:var(--fs-12);padding:6px 10px;min-height:32px;cursor:pointer}
.stage-btn:hover{border-color:var(--accent);color:var(--accent-2)}
.hint{font-size:var(--fs-12);color:rgba(232,225,212,.62)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,10,12,.7) 0%,rgba(6,10,12,.04) 28%,rgba(6,10,12,.06) 62%,rgba(6,10,12,.9) 100%)}
.cover .top{position:relative;z-index:2;border-bottom:1px solid rgba(232,225,212,.14)}
.cover .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s-5);height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:30px;height:30px;object-fit:contain;display:block;flex:none}
.brand b{font-family:var(--font-display);font-size:20px;letter-spacing:.1em}
.brand span{font-size:var(--fs-12);letter-spacing:.2em;color:rgba(232,225,212,.58)}
.issue{font-size:var(--fs-12);letter-spacing:.16em;color:rgba(232,225,212,.55);white-space:nowrap}
.cover .bottom{position:relative;z-index:2;padding:0 0 var(--s-7)}
.cover h1{margin:0 0 var(--s-3);font-family:var(--font-display);font-weight:400;font-size:80px;line-height:1.07;letter-spacing:.01em;text-shadow:0 2px 36px rgba(0,0,0,.4)}
.cover h1 em{font-style:normal;color:var(--accent-2)}
.cover .sub{margin:0 0 var(--s-5);font-size:var(--fs-16);color:rgba(232,225,212,.84)}
.cover .foot{display:flex;align-items:center;gap:var(--s-5);justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;font-size:var(--fs-16);color:var(--text);border:1px solid rgba(232,225,212,.55);background:rgba(8,12,14,.3);transition:border-color .18s,color .18s,background .18s}
.btn:hover{border-color:var(--accent);color:var(--accent-2);background:rgba(8,12,14,.45)}
.quiet{font-size:var(--fs-14);color:rgba(232,225,212,.72);border-bottom:1px solid rgba(232,225,212,.35);padding-bottom:2px;min-height:44px;display:inline-flex;align-items:center}
.quiet:hover{color:var(--accent-2)}
.cap{font-size:var(--fs-12);letter-spacing:.05em;color:rgba(232,225,212,.6);text-align:right;line-height:1.8}

/* ---------- 三个入口 ---------- */
.doors{border-bottom:1px solid var(--line)}
.doors a{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-5);
  padding:var(--s-4) 0;border-bottom:1px solid var(--line);
}
.doors a:last-child{border-bottom:0}
.doors .t{font-family:var(--font-display);font-size:var(--fs-20);letter-spacing:.02em}
.doors .d{font-size:var(--fs-12);color:var(--muted)}
.doors a:hover .t{color:var(--accent)}
.doors a:hover .d{color:var(--text-2)}

/* ---------- 页脚 ---------- */
footer{font-size:var(--fs-12);color:var(--faint)}
footer .wrap{display:flex;justify-content:space-between;gap:var(--s-4);padding:var(--s-4) 0 var(--s-6);flex-wrap:wrap}
footer a{color:var(--muted)}
footer a:hover{color:var(--accent)}

@media (max-width:1080px){
  .wrap{width:calc(100% - 48px)}
  .cover h1{font-size:60px}
}
@media (max-width:640px){
  .wrap{width:calc(100% - 32px)}
  .cover{min-height:94vh}
  .cover .top .wrap{height:56px}
  .brand span,.issue{display:none}
  .cover h1{font-size:44px}
  .cover .sub{font-size:var(--fs-14)}
  .doors a{flex-direction:column;align-items:flex-start;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="cover">

  </div>
  <div class="top">

      <span class="issue">演示版 · 2026.11</span>

  </div>

  <div class="bottom">

      <p class="sub">五个环节，从油藏到加油站。</p>
      <div class="foot">
        <span style="display:flex;align-items:center;gap:var(--s-5);flex-wrap:wrap">

</section>

<nav class="doors" id="doors" aria-label="入口">

    <a href="explore.html"><span class="t">六章知识</span><span class="d">形成 → 开采 → 集输 → 储运 → 炼化 → 终端</span></a>
    <a href="tower.html"><span class="t">塔剖面</span><span class="d">可切半剖 / 全剖，五个热点</span></a>

<footer>
  <div class="wrap">
    <span>示意模型，非真实装置比例 · 讲解要点人工撰写 · <a href="kb.html">来源与边界</a></span>
    <span>油见未来 · V3 重构</span>
  </div>
</footer>

<script>
(function () {
  var v = document.getElementById('loop');
  var stage = document.getElementById('stage');
  var btn = document.getElementById('toggle');
  if (!v || !stage || !btn) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dragging = false, sx = 0, st = 0, timer = null;

  function play() {
    if (reduce) return;
    v.play().catch(function () {});
    btn.textContent = '暂停';
    btn.setAttribute('aria-pressed', 'true');
  }
  function pause() {
    v.pause();
    btn.textContent = '播放';
    btn.setAttribute('aria-pressed', 'false');
  }

  v.addEventListener('error', function () { stage.classList.add('no-video'); });
  btn.addEventListener('click', function () { v.paused ? play() : pause(); });

  if (!reduce) play(); else pause();

  stage.addEventListener('pointerdown', function (e) {
    dragging = true; sx = e.clientX; st = v.currentTime || 0; pause();
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var r = stage.getBoundingClientRect();
    var dur = v.duration || 6;
    var t = (st - (e.clientX - sx) / r.width * dur) % dur;
    if (t < 0) t += dur;
    v.currentTime = t;
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    clearTimeout(timer);
    timer = setTimeout(function () { if (!dragging) play(); }, 1200);
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('pointerenter', function () { if (!dragging) v.pause(); });
  stage.addEventListener('pointerleave', function () { if (!dragging) play(); });
})();
</script></body>
