<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>科普写作台 · 油见未来</title>
<link rel="stylesheet" href="assets/site/tokens.css">
<style>
  :root {
    color-scheme: dark;
    --desk: #0b0f11;
    --panel: #111719;
    --panel-raised: #151c1f;
    --ink: #e8e1d4;
    --ink-soft: #b9b3a6;
    --amber: #d8a24a;
    --selected: rgb(216 162 74 / 10%);
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    min-width: 0;
    margin: 0;
    background: var(--desk);
    color: var(--ink);
    font: 14px/1.6 var(--font-sans);
  }

  button, input, textarea, select { font: inherit; }
  button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }

  :focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 3px;
  }

  .wrap {
    width: min(1280px, calc(100% - 64px));
    margin-inline: auto;
  }

  .site-head {
    min-height: 72px;
    padding: 14px 40px;
    border-bottom: 1px solid #1d303a;
    background: #0b0f11;
    font: 15px/1.7 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  .site-head .wrap {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
    width: 100%;
    margin: 0;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: inherit;
    font: 400 19px/1.7 var(--font-display);
    letter-spacing: .04em;
    text-decoration: none;
    white-space: nowrap;
  }

  .brand img {
    width: 28px;
    height: 28px;
    object-fit: contain;
    display: block;
    flex: none;
  }

  .site-nav {
    display: flex;
    gap: 6px;
    margin-left: 8px;
  }

  .site-nav a {
    padding: 7px 13px;
    color: #9a948a;
    font-size: 13px;
    text-decoration: none;
    white-space: nowrap;
    border-radius: 2px;
  }

  .site-nav a:hover { color: #e6f1f5; }

  .site-nav a[aria-current="page"] { color: #e8e1d4; background: #1e1f1a; }
  .site-nav a:focus-visible { outline-offset: -5px; }

  @media (max-width: 720px) {
    .site-head .wrap { gap: 8px; }
    .site-nav { margin: 0; flex-wrap: wrap; }
  }

  @media (max-width: 600px) {
    .site-head { padding: 12px 18px; }
    .site-nav { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  }

  main.wrap { padding: 42px 0 64px; }

  .page-heading {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 32px;
    margin-bottom: 30px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 10px;
    color: var(--accent-2);
    font: 12px/1.4 var(--font-mono);
    letter-spacing: .08em;
  }

  .eyebrow::before {
    width: 18px;
    height: 1px;
    background: var(--amber);
    content: "";
  }

  h1 {
    margin: 0;
    font: 400 clamp(36px, 4.4vw, 54px)/1.14 var(--font-display);
    letter-spacing: .01em;
  }

  h1 span { color: var(--accent-2); }

  .lede {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 15px;
  }

  .heading-note {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: none;
    padding-bottom: 5px;
    color: var(--muted);
    font-size: 12px;
  }

  .heading-note svg { color: var(--accent); }

  .workspace {
    display: grid;
    grid-template-columns: 350px minmax(0, 1fr);
    align-items: stretch;
    overflow: hidden;
    border: 1px solid var(--line-2);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 24px 70px rgb(0 0 0 / 18%);
  }

  .materials {
    min-width: 0;
    border-right: 1px solid var(--line-2);
    background: var(--panel-raised);
  }

  .draft-column {
    display: flex;
    min-width: 0;
    flex-direction: column;
  }

  .panel-head {
    display: flex;
    min-height: 68px;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
  }

  .panel-title {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .02em;
    white-space: nowrap;
  }

  .panel-hint, .field-hint, .meta, .revise-note, .form-note {
    color: var(--muted);
    font-size: 12px;
  }

  .panel-hint {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .panel-hint::before {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--amber);
    content: "";
  }

  .materials-body { padding: 24px; }
  .field { min-width: 0; }

  .field > label, .field-group > legend {
    display: block;
    margin-bottom: 8px;
    padding: 0;
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
  }

  .field-hint {
    margin-left: 7px;
    font-weight: 400;
  }

  .field-group {
    min-width: 0;
    margin: 22px 0;
    padding: 0;
    border: 0;
  }

  .genres {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
  }

  .genres button, .chips button {
    border: 1px solid var(--line-2);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 160ms ease, background-color 160ms ease, color 160ms ease;
  }

  .genres button {
    min-height: 38px;
    padding: 6px 4px;
    border-radius: 6px;
    font-size: 12px;
  }

  .genres button:hover, .chips button:hover {
    border-color: var(--accent);
    color: var(--accent-2);
  }

  .genres button[aria-pressed="true"] {
    border-color: rgb(216 162 74 / 62%);
    background: var(--selected);
    color: var(--accent-2);
    box-shadow: inset 0 0 0 1px rgb(216 162 74 / 8%);
  }

  .settings {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }

  .materials-body > .field { margin-bottom: 22px; }

  textarea, input[type="text"], select {
    display: block;
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid var(--line-2);
    border-radius: 6px;
    outline: none;
    background: var(--desk);
    color: var(--ink);
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }

  textarea:hover, input[type="text"]:hover, select:hover { border-color: var(--muted); }

  textarea:focus, input[type="text"]:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgb(216 162 74 / 10%);
  }

  textarea {
    min-height: 80px;
    line-height: 1.75;
    resize: vertical;
  }

  #facts { min-height: 142px; }

  select { cursor: pointer; }

  ::placeholder {
    color: var(--muted);
    opacity: 1;
  }

  .btn-primary, .btn-outline, .btn-ghost {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: border-color 160ms ease, background-color 160ms ease, color 160ms ease, transform 160ms ease;
  }

  .btn-primary svg, .btn-outline svg, .btn-ghost svg {
    width: 16px;
    height: 16px;
    flex: none;
  }

  .btn-primary, .btn-outline {
    min-height: 44px;
    padding: 9px 17px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    font-weight: 700;
  }

  .btn-primary {
    width: 100%;
    background: var(--amber);
    color: var(--desk);
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-2);
    transform: translateY(-1px);
  }

  .btn-outline {
    border-color: var(--line-2);
    background: transparent;
    color: var(--ink);
  }

  .btn-outline:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--selected);
    color: var(--accent-2);
  }

  button:disabled {
    opacity: .45;
    cursor: default;
    transform: none;
  }

  .form-note {
    margin: 10px 0 0;
    text-align: center;
  }

  .sheet-stage {
    flex: 1;
    background: var(--desk);
  }

  .sheet-wrap { position: relative; }

  .out {
    min-height: 408px;
    max-height: 560px;
    overflow: auto;
    overflow-wrap: anywhere;
    padding: 38px clamp(28px, 4vw, 52px) 42px;
    font: 16px/2 var(--font-serif);
    white-space: pre-wrap;
    caret-color: var(--accent);
    scrollbar-color: var(--line-2) transparent;
    scrollbar-width: thin;
  }

  .out[contenteditable="true"] { cursor: text; }
  .out:focus-visible { outline-offset: -3px; }

  .out .m-title {
    max-width: 650px;
    margin-bottom: 24px;
    color: var(--ink);
    font-size: clamp(23px, 2.3vw, 30px);
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: .02em;
  }

  .out .m-body { max-width: 720px; }

  .out__empty {
    color: var(--muted);
    font: 14px/1.8 var(--font-sans);
  }

  .veil {
    position: absolute;
    z-index: 2;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgb(11 15 17 / 84%);
    color: var(--accent-2);
    font-weight: 600;
    backdrop-filter: blur(3px);
  }

  .veil span {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .veil span::before {
    width: 15px;
    height: 15px;
    border: 1px solid rgb(239 198 132 / 30%);
    border-top-color: var(--accent-2);
    border-radius: 50%;
    content: "";
    animation: spin 800ms linear infinite;
  }

  .sheet-wrap.busy .veil { display: flex; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .draft-tools {
    display: flex;
    min-height: 52px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding: 7px 20px 7px 24px;
    border-block: 1px solid var(--line);
    background: var(--panel);
  }

  .meta {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  .meta:empty { display: none; }

  .tools {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
  }

  .draft-tools .tools { margin-left: auto; }

  .btn-ghost {
    min-height: 34px;
    padding: 5px 9px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--ink-soft);
    font-size: 12px;
    white-space: nowrap;
  }

  .btn-ghost svg { width: 14px; height: 14px; }

  .btn-ghost:hover {
    background: var(--selected);
    color: var(--accent-2);
  }

  .revise {
    padding: 22px 24px 24px;
    background: var(--panel);
  }

  .revise-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 12px;
  }

  .revise-heading .panel-title { font-size: 14px; }

  .chips, .revise-acts {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .revise-acts {
    justify-content: space-between;
    margin-top: 12px;
  }

  .chips button {
    min-height: 30px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
  }

  .revise .btn-outline {
    min-height: 38px;
    padding-block: 6px;
    font-size: 13px;
  }

  .revise-note {
    display: block;
    margin-top: 9px;
    color: var(--accent-2);
  }

  .revise-note:empty { display: none; }

  @media (max-width: 1040px) {
    .wrap { width: calc(100% - 48px); }
    .workspace { grid-template-columns: 320px minmax(0, 1fr); }
    .panel-head, .materials-body, .revise { padding-inline: 20px; }
    .out { padding-inline: 30px; }
    .heading-note { display: none; }
  }

  @media (max-width: 900px) {
    main.wrap { padding-top: 32px; }
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .materials { border-right: 0; border-bottom: 1px solid var(--line-2); }
    .materials-body {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 20px;
    }
    .materials-body > .field:first-child,
    .materials-body > .field-group,
    .materials-body > .btn-primary,
    .materials-body > .form-note { grid-column: 1 / -1; }
    .settings { align-self: start; }
    .out { min-height: 340px; max-height: none; }
  }

  @media (max-width: 560px) {
    .wrap { width: calc(100% - 28px); }
    main.wrap { padding: 26px 0 40px; }
    .page-heading { margin-bottom: 22px; }
    .eyebrow { margin-bottom: 8px; font-size: 11px; }
    h1 { font-size: clamp(32px, 10vw, 42px); }
    .lede { margin-top: 10px; font-size: 13px; }
    .workspace { border-radius: 9px; }
    .panel-head { min-height: 58px; padding: 13px 16px; }
    .materials-body { display: block; padding: 20px 16px; }
    .field-group { margin-block: 20px; }
    .settings { margin-bottom: 20px; }
    textarea, input[type="text"], select { font-size: 16px; }
    #facts { min-height: 150px; }
    .out { min-height: 330px; padding: 28px 20px 34px; font-size: 16px; }
    .out .m-title { margin-bottom: 20px; font-size: 24px; }
    .draft-tools { padding: 8px 12px 8px 16px; }
    .meta { width: 100%; }
    .draft-tools .tools { margin-left: 0; }
    .revise { padding: 20px 16px; }
    .revise-heading { display: block; }
    .revise-heading .panel-hint { margin-top: 3px; }
    .revise-acts { align-items: flex-end; }
    .chips { flex: 1 1 210px; gap: 6px; }
    .chips button { padding-inline: 9px; }
    .revise .btn-outline { width: 100%; margin-top: 4px; }
  }

  @media (max-width: 350px) {
    .genres { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .settings { grid-template-columns: minmax(0, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition: none !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="assets/science-logo.png" alt="中国石油"><span>油见未来</span></a>
    <nav class="site-nav" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="ask.html">智能问答</a>
      <a href="sandbox.html">沉浸式讲解</a>
      <a href="write.html" aria-current="page">科普文案</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <header class="page-heading">
    <div>
      <p class="eyebrow">科普写作台</p>
      <h1>把复杂，写得<span>明白。</span></h1>
      <p class="lede">从一条事实开始，写一篇可读、可改的石油科普稿。</p>
    </div>
  </header>

  <div class="workspace">
    <section class="materials" aria-labelledby="input-title">
      <div class="panel-head">
        <h2 class="panel-title" id="input-title">写作素材</h2>
        <span class="panel-hint">先定方向</span>
      </div>
      <div class="materials-body">
        <div class="field">
          <label for="topic">写作主题</label>
          <input id="topic" type="text" placeholder="原油怎样从地下走到加油站">
        </div>

        <fieldset class="field-group">
          <legend>体裁</legend>
          <div class="genres" id="genres">
            <button type="button" data-g="post" aria-pressed="true">科普推文</button>
            <button type="button" data-g="copy" aria-pressed="false">展品讲解词</button>
            <button type="button" data-g="event" aria-pressed="false">活动策划方案</button>
            <button type="button" data-g="news" aria-pressed="false">新闻稿</button>
            <button type="button" data-g="poster" aria-pressed="false">海报文案</button>
            <button type="button" data-g="broadcast" aria-pressed="false">广播稿</button>
          </div>
        </fieldset>

        <div class="settings">
          <div class="field">
            <label for="audience">目标读者</label>
            <select id="audience">
              <option value="youth">亲子与青少年</option>
              <option value="public" selected>普通公众</option>
              <option value="enthusiast">科技／石油爱好者</option>
              <option value="professional">专业人士</option>
            </select>
          </div>
          <div class="field">
            <label for="style">表达风格</label>
            <select id="style">
              <option value="rigorous">严谨</option>
              <option value="lively">活泼</option>
              <option value="storytelling">故事化</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="facts">事实底稿<span class="field-hint">一行一条</span></label>
          <textarea id="facts" rows="7"></textarea>
        </div>

        <button class="btn-primary" id="go" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 1.4 4.6L18 9l-4.6 1.4L12 15l-1.4-4.6L6 9l4.6-1.4L12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m18.5 14 .8 2.7 2.7.8-2.7.8-.8 2.7-.8-2.7-2.7-.8 2.7-.8.8-2.7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          生成稿件
        </button>
        <p class="form-note">生成后可直接在右侧继续修改</p>
      </div>
    </section>

    <div class="draft-column">
      <section aria-labelledby="output-title">
        <div class="panel-head">
          <h2 class="panel-title" id="output-title">稿件预览</h2>
        </div>
        <div class="sheet-stage">
          <div class="sheet-wrap" id="sheetwrap">
            <div class="out" id="out" contenteditable="false" spellcheck="false" role="textbox" aria-labelledby="output-title" aria-multiline="true"></div>
            <div class="veil" role="status"><span id="veiltext">正在生成…</span></div>
          </div>
        </div>
        <div class="draft-tools">
          <p class="meta" id="meta" aria-live="polite"></p>
          <div class="tools">
            <button type="button" class="btn-ghost" id="copy">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.5"/></svg>
              复制
            </button>
            <button type="button" class="btn-ghost" id="dl">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 19h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              下载 Word
            </button>
            <button type="button" class="btn-ghost" id="clear">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              清空
            </button>
          </div>
        </div>
      </section>

      <section class="revise" aria-labelledby="revise-title">
        <div class="revise-heading">
          <h2 class="panel-title" id="revise-title">修改意见</h2>
          <span class="panel-hint">继续调整语气、长度或开头</span>
        </div>
        <textarea id="comment" rows="2" aria-labelledby="revise-title" placeholder="例如：开头换一个生活场景，全文缩短到 200 字"></textarea>
        <div class="revise-acts">
          <div class="chips" id="chips">
            <button type="button" data-c="更口语一点，少用术语">更口语</button>
            <button type="button" data-c="缩短到 200 字">缩短到 200 字</button>
            <button type="button" data-c="换一个开头">换开头</button>
            <button type="button" data-c="加一个生活里的比喻">加比喻</button>
            <button type="button" data-c="删掉空话套话">删空话</button>
          </div>
          <button class="btn-outline" id="revise" type="button">
            按意见修改
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <span class="revise-note" id="revnote" role="status"></span>
      </section>
    </div>
  </div>
</main>

<script src="scene-context.js?v=1"></script>
<script src="docx.js"></script>
<script>
(function () {
  if (!window.SceneContext) return;
  var params = new URLSearchParams(location.search);
  if (params.get('from') !== 'scene') return;
  var data = SceneContext.readHandoff({ consume: true });
  if (!data) return;
  function byId(id) { return document.getElementById(id); }
  function addBanner() {
    var main = document.querySelector('main');
    if (!main) return;
    var box = document.createElement('div');
    box.id = 'scene-handoff';
    box.setAttribute('role', 'status');
    box.style.cssText = 'margin:14px 0 0;padding:10px 12px;border:1px solid #2d4c58;border-radius:8px;background:#0d1b22;color:#b8cbd3;font-size:12px;line-height:1.7;display:flex;gap:10px;align-items:flex-start;justify-content:space-between';
    var text = document.createElement('span');
    text.textContent = '已带入当前场景：' + (data.objectName || data.stageId || '总览') + ' · 仅用于本次写作；已核验要点 ' + (data.facts || []).length + ' 条。';
    var clear = document.createElement('button');
    clear.type = 'button';
    clear.textContent = '清除';
    clear.style.cssText = 'background:transparent;border:1px solid #355864;color:#cfe3ea;border-radius:4px;padding:3px 8px;cursor:pointer;flex:none';
    clear.onclick = function () { box.remove(); };
    box.append(text, clear);
    main.insertBefore(box, main.firstChild);
  }
  addBanner();
  var topic = byId('topic'), facts = byId('facts');
  if (topic && (!topic.value.trim() || topic.value === topic.defaultValue)) topic.value = data.topic || '';
  if (facts && !facts.value.trim()) facts.value = (data.facts || []).join('\n');
})();
</script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const EMPTY = '生成的文字会出现在这里。';
  const GENRE_NAME = { post: '科普推文', copy: '展品讲解词', event: '活动策划方案', news: '新闻稿', poster: '海报文案', broadcast: '广播稿' };
  const TITLED = { post: 1, news: 1, poster: 1 };
  let genre = 'post';
  let last = '';
  let origin = '';
  let busy = false;
  let draftVersion = 0;

  function setEmpty(msg) {
    const out = $('#out');
    out.contentEditable = 'false';
    out.replaceChildren();
    const s = document.createElement('span');
    s.className = 'out__empty';
    s.textContent = msg || EMPTY;
    out.appendChild(s);
  }
  function renderManuscript(text) {
    const out = $('#out');
    out.replaceChildren();
    if (TITLED[genre] && text.includes('\n')) {
      const nl = text.indexOf('\n');
      const t = document.createElement('div');
      t.className = 'm-title';
      t.textContent = text.slice(0, nl).trim();
      out.appendChild(t);
      const b = document.createElement('div');
      b.className = 'm-body';
      b.textContent = text.slice(nl + 1).replace(/^\n+/, '');
      out.appendChild(b);
    } else {
      const b = document.createElement('div');
      b.className = 'm-body';
      b.textContent = text;
      out.appendChild(b);
    }
    out.contentEditable = 'true';
    out.scrollTop = 0;
    last = out.innerText;
  }
  function readDraft() {
    const out = $('#out');
    if (out.querySelector('.out__empty')) return '';
    return out.innerText;
  }
  function syncMeta() {
    const n = last.replace(/\s/g, '').length;
    $('#meta').textContent = last ? (n + ' 字 · ' + GENRE_NAME[genre] + (origin ? ' · ' + origin : '')) : '';
  }
  function setOrigin(o) { origin = o; syncMeta(); }
  function setBusy(on, text) {
    busy = on;
    $('#sheetwrap').classList.toggle('busy', on);
    $('#veiltext').textContent = text || '正在生成…';
    $('#go').disabled = on;
    $('#revise').disabled = on || !last;
    $('#out').contentEditable = on ? 'false' : (last ? 'true' : 'false');
  }

  function factsArr() { return $('#facts').value.split('\n').map(s => s.trim()).filter(Boolean); }
  function clearDraft() {
    draftVersion++;
    last = ''; origin = '';
    setEmpty();
    $('#meta').textContent = '';
    $('#comment').value = '';
    $('#revnote').textContent = '';
    $('#revise').disabled = true;
  }
  $('#topic').addEventListener('input', clearDraft);
  $('#genres').addEventListener('click', e => {
    const b = e.target.closest('button[data-g]');
    if (!b || b.dataset.g === genre) return;
    genre = b.dataset.g;
    Array.prototype.forEach.call($('#genres').children, x => x.setAttribute('aria-pressed', String(x === b)));
    clearDraft();
  });

  $('#out').addEventListener('input', () => {
    last = readDraft();
    if (last) setOrigin('手改'); else { origin = ''; syncMeta(); }
    $('#revise').disabled = busy || !last;
  });

  async function requestDraft(draft, comment) {
    const audience = { youth: '亲子与青少年', public: '普通公众', enthusiast: '科技／石油爱好者', professional: '专业人士' };
    const style = { rigorous: '严谨', lively: '活泼', storytelling: '故事化' };
    const response = await fetch('/api/dify-write', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: $('#topic').value.trim(), genre: GENRE_NAME[genre], facts: factsArr().join('\n'), audience: audience[$('#audience').value], style: style[$('#style').value], draft, comment })
    });
    const result = await response.json();
    if (!response.ok || !result.text) throw new Error(result.error || '生成失败，请稍后重试。');
    return result.text;
  }

  function templateDraft() {
    const topic = $('#topic').value.trim() || '石油产业链中的这一环节';
    const facts = factsArr();
    const verified = facts.length ? facts.slice(0, 6).map(x => '· ' + x).join('\n') : '· 尚未填写事实底稿';
    const genreName = GENRE_NAME[genre] || '科普短文';
    return '【预置模板 · 未连接模型，不是模型生成】\n\n' +
      '主题：' + topic + '\n\n' +
      '可以这样写：先从一个具体问题切入，再解释这个环节的作用，最后说明它和日常生活的联系。\n\n' +
      '可核验的事实底稿：\n' + verified + '\n\n' +
      '请把以上材料改写成一篇' + genreName + '；不要编造没有底稿支持的数字或工程参数。';
  }

  async function generate() {
    if (busy) return;
    if (!$('#topic').value.trim() && !factsArr().length) { if (!last) setEmpty('请先填写写作主题或事实底稿。'); else $('#revnote').textContent = '请先填写写作主题或事实底稿。'; return; }
    const version = draftVersion;
    setBusy(true, '正在生成…');
    $('#revnote').textContent = '';
    try {
      const text = await requestDraft('', '');
      if (version !== draftVersion) return;
      renderManuscript(text);
      setOrigin('初稿');
    } catch (e) {
      if (version !== draftVersion) return;
      if (!last) {
        renderManuscript(templateDraft());
        setOrigin('预置模板 · 未连接模型');
        $('#revnote').textContent = '模型服务未连接，已放入可编辑的预置模板，不是模型输出。';
      } else {
        $('#revnote').textContent = e.message;
      }
    } finally { setBusy(false); }
  }

  async function revise() {
    if (busy || !last) return;
    const comment = $('#comment').value.trim();
    if (!comment) { $('#comment').focus(); $('#revnote').textContent = '先写一句修改意见，或点一个方向。'; return; }
    const version = draftVersion;
    setBusy(true, '正在按意见修改…');
    try {
      const next = await requestDraft(last, comment);
      if (version !== draftVersion) return;
      renderManuscript(next);
      setOrigin('意见改');
      $('#revnote').textContent = '已按意见修改，可继续手改或再提意见。';
    } catch (e) { if (version === draftVersion) $('#revnote').textContent = e.message; }
    finally { setBusy(false); }
  }

  $('#go').onclick = generate;
  $('#revise').onclick = revise;
  $('#chips').addEventListener('click', e => {
    const b = e.target.closest('button[data-c]');
    if (!b) return;
    $('#comment').value = b.dataset.c;
    $('#comment').focus();
    $('#revnote').textContent = '改完仍可在预览里继续手改。';
  });

  $('#copy').onclick = async () => {
    if (!last) return;
    try { await navigator.clipboard.writeText(last); $('#meta').textContent = '已复制'; }
    catch { $('#meta').textContent = '浏览器不允许复制，可手动选择'; }
    setTimeout(syncMeta, 1200);
  };
  $('#dl').onclick = () => {
    if (!last) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(window.makeManuscriptDocx(last, Boolean($('#out .m-title'))));
    a.download = '科普文案-' + new Date().toISOString().slice(0, 10) + '.docx';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#clear').onclick = clearDraft;

  if (!$('#topic').value) $('#topic').value = '原油怎样从地下走到加油站';
  setEmpty();
  $('#revise').disabled = true;
})();
</script>
</body>
</html>
