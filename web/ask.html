<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>科普问答 · 油见未来</title>
<link rel="stylesheet" href="assets/site/tokens.css">
<style>
  :root{--bg:#0b0f11;--panel:#0a151f;--line:#17303c;--text:#e6f1f5;--muted:#9a948a;--dim:#5f7d8a;
        --amber:#d8a24a;--cyan:#8fb6ad}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  header{border-bottom:1px solid var(--line);padding:16px 40px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;text-decoration:none;color:inherit}
  .brand img{width:26px;height:26px;object-fit:contain;display:block;flex:none}
  nav{display:flex;gap:6px;margin-left:8px}
  nav a{font-size:13px;color:var(--muted);text-decoration:none;padding:6px 12px;border:1px solid transparent;border-radius:2px}
  nav a:hover{color:var(--text);border-color:var(--line)}
  nav a[aria-current]{color:var(--amber);border-color:rgba(216,162,74,.45)}
  main{max-width:900px;margin:0 auto;padding:34px 40px 90px}
  .heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0 0 6px;font-size:30px;letter-spacing:.01em}
  h1 em{font-style:normal;color:var(--amber)}
  .sub{margin:0 0 24px;font-size:13px;color:var(--muted)}
  .new-chat{padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--text);
            border-radius:2px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .new-chat:hover{border-color:var(--cyan)}
  .composer{position:sticky;bottom:0;padding:12px 0;background:var(--bg);z-index:1}
  .askbar{display:flex;gap:10px}
  .askbar input{flex:1;min-width:0;height:48px;padding:0 16px;background:var(--panel);border:1px solid var(--line);
                color:var(--text);font:inherit;font-size:15px;border-radius:2px}
  .askbar input:focus{outline:2px solid var(--cyan);outline-offset:-1px}
  .askbar button{height:48px;padding:0 26px;background:var(--amber);color:#201a10;border:0;
                 font:inherit;font-weight:700;font-size:15px;border-radius:2px;cursor:pointer}
  .askbar button:disabled{opacity:.55;cursor:default}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 26px}
  .chips button{height:34px;padding:0 14px;background:var(--panel);border:1px solid var(--line);
                color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;border-radius:2px}
  .chips button:hover{border-color:var(--cyan);color:var(--cyan)}
  .ans{border:1px solid var(--line);background:var(--panel);padding:22px 24px;border-radius:2px;margin-bottom:18px}
  .turn__q{width:fit-content;max-width:90%;margin:0 0 10px auto;padding:8px 14px;white-space:pre-wrap;
           overflow-wrap:anywhere;background:#261e14;border:1px solid #5a4a2c;color:var(--text);border-radius:2px}
  .turn__q b{font-weight:600;color:var(--amber);margin-right:8px}
  .ans__t{font-size:16px;line-height:1.85;white-space:pre-wrap}
  .ans__t{overflow-wrap:anywhere}
  .src{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .src b{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em}
  .src ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
  .src li a{color:var(--text);text-decoration:none;font-size:13.5px;border-bottom:1px dashed rgba(143,182,173,.35)}
  .src li a:hover{color:var(--cyan)}
  .src li span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
  .hintbox{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.8}
  .hintbox a{color:#9a948a;text-decoration:none}
  .hintbox a:hover{text-decoration:underline}
  .loading{color:var(--cyan);font-size:13px}
  @media(max-width:720px){main{padding:24px 20px 24px}header{padding:12px 18px;gap:8px}nav{margin:0;flex-wrap:wrap}h1{font-size:24px}}
  .welcome,.send-icon,.composer-plus,.composer-mode,.explore,.suggestion-title,.composer-note{display:none}
  body.is-empty{color-scheme:dark;min-height:100svh;background:#0b0f11;color:#e8e1d4}
  .is-empty header{min-height:72px;padding:14px 40px;background:#0b0f11;border-color:#242a2d}
  .is-empty .brand{font-size:17px;letter-spacing:.04em}
  .is-empty nav a{border:0;border-radius:8px;padding:7px 13px}
  .is-empty nav a[aria-current]{color:#e8e1d4;background:#1e1f1a}
  .is-empty main{width:min(100%,800px);padding:clamp(90px,15vh,160px) 24px 80px}
  .is-empty .heading,.is-empty .sub,.is-empty #out,.is-empty .hintbox,.is-empty .send-label{display:none}
  .is-empty .welcome{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 30px}
  .welcome-mark{display:grid;place-items:center;width:38px;height:38px;margin-bottom:22px;border-radius:12px;background:#d8a24a}
  .welcome svg{width:20px;height:25px;color:#201a10}
  .welcome h1{margin:0;color:#e8e1d4;font:600 clamp(28px,4vw,36px)/1.3 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:-.03em}
  .welcome p{margin:10px 0 0;color:#9a948a;font-size:15px}
  .is-empty .composer{position:relative;margin:0;padding:0;background:transparent}
  .askbar,.is-empty .askbar{display:flex;align-items:center;gap:8px;min-height:58px;padding:8px 12px 8px 20px;background:#141816;border:1px solid #3d3a33;border-radius:32px;box-shadow:0 4px 16px #0002;transition:border-color .2s,box-shadow .2s}
  .askbar:focus-within,.is-empty .askbar:focus-within{border-color:#78939a;box-shadow:0 4px 18px #0003}
  .askbar textarea,.is-empty .askbar textarea{display:block;flex:1;min-width:0;min-height:40px;max-height:160px;padding:8px 0;background:transparent;color:#e2dbc9;border:0;outline:0;resize:none;overflow-y:auto;font:inherit;font-size:15px;line-height:24px}
  .askbar textarea::placeholder,.is-empty .askbar textarea::placeholder{color:#9a948a}
  .askbar button#send,.is-empty .askbar button#send{display:grid;place-items:center;flex:none;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:#d8a24a;color:#201a10;cursor:pointer}
  .askbar button#send:hover,.is-empty .askbar button#send:hover{background:#e6bf86;color:#201a10}
  .askbar button#send:disabled{opacity:.5;cursor:default}
  .send-label,.composer-mode,.composer-note{display:none}
  .send-icon,.is-empty .send-icon{display:block;width:18px;height:18px}
  .is-empty .suggestion-title{display:block;margin:30px 0 13px;color:#9a948a;font-size:12px;font-weight:500;letter-spacing:.04em}
  .is-empty .chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
  .is-empty .chips button{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;height:auto;padding:11px 13px;text-align:left;line-height:1.5;color:#b6b0a2;background:transparent;border:1px solid #2a2a24;border-radius:10px;font-size:13px;transition:background .2s,border-color .2s,color .2s}
  .is-empty .chips button::after{content:"↗";color:#728890;flex:none}
  .is-empty .chips button:hover{color:#f3f6f5;background:#1a1b16;border-color:#4a4438}
  .is-empty main button:focus-visible{outline:2px solid #cfc8ba;outline-offset:3px}
  @media(max-width:600px){
    .is-empty header{padding:12px 18px;gap:8px}
    .is-empty nav{width:100%;overflow-x:auto;flex-wrap:nowrap}
    .is-empty nav a{white-space:nowrap}
    .is-empty main{padding:76px 18px 48px}
    .is-empty .welcome{margin-bottom:26px}
    .is-empty .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(prefers-reduced-motion:reduce){.is-empty .askbar,.is-empty .chips button{transition:none}}

  body:not(.is-empty){background:#0b0f11;color:#e8e1d4}
  body:not(.is-empty) header{background:#0b0f11;border-color:#242a2d}
  body:not(.is-empty) main{max-width:800px;padding:34px 24px 270px}
  body:not(.is-empty) .heading h1{font-size:20px;font-weight:600}
  body:not(.is-empty) .sub{margin:2px 0 30px;color:#8b867d}
  body:not(.is-empty) .new-chat{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:8px 12px;border:0;border-radius:8px;background:transparent;color:#cfc8ba;font-size:14px;font-weight:400;transition:background .18s,color .18s}
  body:not(.is-empty) .new-chat:hover{background:#1e1f1a;color:#fff}
  .new-chat__icon{display:grid;place-items:center;width:18px;height:18px;color:currentColor}
  .new-chat__icon svg{width:18px;height:18px}
  .new-chat:focus-visible{outline:2px solid #cfc8ba;outline-offset:3px}
  @media(prefers-reduced-motion:reduce){body:not(.is-empty) .new-chat{transition:none}}
  body:not(.is-empty) .chips{display:none}
  #out article{margin:0 0 42px}
  .user-message{display:flex;flex-direction:column;align-items:flex-end;margin:0 0 20px}
  .turn__q{max-width:82%;margin:0;padding:12px 18px;border:0;border-radius:18px;background:#1c1d18;color:#e8e1d4;line-height:1.65}
  .user-actions{display:flex;align-items:center;gap:4px;min-height:28px;color:#8b867d;font-size:12px;opacity:0;transition:opacity .15s}
  .user-message:hover .user-actions,.user-message:focus-within .user-actions{opacity:1}
  .user-actions[hidden]{display:none}
  .user-actions time{margin-right:4px}
  .message-action{display:grid;place-items:center;width:27px;height:27px;padding:0;border:0;border-radius:6px;background:transparent;color:#9a948a;cursor:pointer}
  .message-action:hover,.message-action:focus-visible{background:#23241f;color:#e2dbc9}
  .message-action svg{width:15px;height:15px}
  .message-action:focus-visible{outline:2px solid #cfc8ba;outline-offset:2px}
  .edit-message{width:min(100%,540px);padding:14px;background:#1c1d18;border:1px solid #4a4438;border-radius:16px}
  .edit-message textarea{display:block;width:100%;min-height:54px;padding:0;resize:vertical;border:0;outline:0;background:transparent;color:#e8e1d4;font:inherit}
  .edit-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
  .edit-actions button{padding:6px 12px;border:1px solid #4a4438;border-radius:8px;background:transparent;color:#e8e1d4;font:inherit;font-size:12px;cursor:pointer}
  .edit-actions .edit-save{background:#cfc8ba;color:#17252c;border-color:#cfc8ba}
  .edit-actions button:disabled{opacity:.5;cursor:default}
  @media(hover:none){.user-actions{opacity:1}}
  .ans{margin:0;padding:0;border:0;background:transparent;border-radius:0}
  .ans__t{font-size:16px;line-height:1.75;color:#cfc8ba;overflow-wrap:anywhere;white-space:normal}
  .ans__t p{margin:.6em 0}
  .ans__t > :first-child{margin-top:0}
  .ans__t > :last-child{margin-bottom:0}
  .ans__t h1,.ans__t h2,.ans__t h3,.ans__t h4,.ans__t strong{color:#e8e1d4}
  .ans__t h1{font-size:1.7em;line-height:1.2;margin:0 0 .5em}
  .ans__t h2{font-size:1.35em;line-height:1.35;margin:1.8em 0 .5em}
  .ans__t h3{font-size:1.1em;line-height:1.6;margin:1.4em 0 .4em}
  .ans__t h4{font-size:1em;line-height:1.5;margin:1em 0 .4em}
  .ans__t strong{font-weight:600}
  .ans__t ul,.ans__t ol{margin:.5em 0 1em;padding-inline-start:1.2rem}
  .ans__t li{margin:.25em 0}
  .ans__t li::marker{color:#9a948a}
  .ans__t li > p{margin:.25em 0}
  .ans__t blockquote{margin:1.4em 0;padding-inline-start:1em;border-inline-start:.25rem solid #4a4438;color:#e2dbc9}
  .ans__t a{color:#d8a24a;text-decoration:none;overflow-wrap:anywhere}
  .ans__t a:hover{text-decoration:underline}
  .ans__t :not(pre)>code{padding:.15em .4em;border-radius:.3em;background:#23241f;font-size:.875em}
  .ans__t pre{overflow:auto;padding:1em;border:1px solid #3d3a33;border-radius:6px;background:#141816;white-space:pre}
  .ans__t table{width:100%;margin:1em 0;border-collapse:collapse;font-size:.875em}
  .ans__t th,.ans__t td{padding:.4em .6em;text-align:left;border-bottom:1px solid #3d3a33}
  .ans__t hr{margin:1.4em 0;border:0;border-top:1px solid #3d3a33}
  .answer-actions{display:flex;align-items:center;gap:4px;margin-top:16px;color:#789099;font-size:12px}
  .loading{display:flex;align-items:center;gap:9px;color:#9aafb6;font-size:14px}
  .loading::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber);animation:answer-pulse 1.2s ease-in-out infinite}
  @keyframes answer-pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  @media(prefers-reduced-motion:reduce){.loading::before{animation:none}}
  body:not(.is-empty) .composer{position:fixed;z-index:2;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,800px);padding:16px 24px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b0f11 18%)}
  body:not(.is-empty) .hintbox{text-align:center;color:#758b93}
  @media(max-width:600px){body:not(.is-empty) main{padding:24px 18px 270px}body:not(.is-empty) .composer{padding-inline:18px}.turn__q{max-width:90%}.ans__t h2{font-size:20px}}

  /* 科普问答首页 */
  .is-empty header{border-bottom-color:#1d303a}
  .is-empty main{width:min(100%,860px);padding:clamp(62px,10vh,102px) 24px 90px}
  .is-empty .welcome{position:relative;display:flex;align-items:flex-start;text-align:left;min-height:180px;margin:0 0 24px;padding:8px 0 12px;overflow:hidden}
  .is-empty .welcome-mark{display:none}
  .is-empty .welcome .eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 18px;color:#d8a24a;font-size:12px;font-weight:600;letter-spacing:.12em}
  .is-empty .welcome .eyebrow::before{content:"";width:18px;height:1px;background:#d8a24a}
  .is-empty .welcome h1{position:relative;z-index:1;max-width:560px;font:600 clamp(30px,4vw,42px)/1.35 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.01em;color:#e2dbc9}
  .is-empty .welcome p{position:relative;z-index:1;display:block;margin:12px 0 0;color:#9a948a;font-size:14px}
  .strata{display:none}
  .is-empty .strata{display:block;position:absolute;right:40px;top:12px;width:132px;height:132px;object-fit:contain;pointer-events:none}
  .is-empty .askbar{min-height:66px;padding:10px 12px 10px 22px;border-color:#3a5057;background:#14252e;box-shadow:0 12px 36px #0003}
  .is-empty .askbar button#send{width:38px;height:38px;background:#d8a24a;color:#201a10}
  .is-empty .askbar button#send:hover{background:#e6bf86}
  .is-empty .suggestion-title{display:block;margin:34px 0 14px;color:#9a948a;font-size:12px;font-weight:500;letter-spacing:.04em}
  .is-empty .chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:10px;margin:0}
  .is-empty .chips button{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:8px;min-height:120px;padding:16px;text-align:left;border:1px solid #273e47;border-radius:12px;background:#102029;color:#cfc8ba;font-size:14px;line-height:1.5;transition:background .2s,border-color .2s,transform .2s}
  .is-empty .chips button::after{content:"↗";position:absolute;right:15px;top:13px;color:#678087;font-size:15px}
  .is-empty .chips button:hover{background:#182d35;border-color:#5b7779;transform:translateY(-2px)}
  .is-empty .chips svg{width:18px;height:18px;stroke:#d8a24a}
  .is-empty .chips .shortcut-label{color:#9a948a;font-size:12px;letter-spacing:.06em}
  .is-empty .chips .shortcut-question{font-size:14px;color:#cfc8ba}
  .is-empty .hintbox{display:block;position:static;margin:12px 4px 0;text-align:left;color:#718990;font-size:12px}
  @media(max-width:600px){
    .is-empty main{padding:54px 18px 48px}
    .is-empty .welcome{min-height:158px;margin-bottom:16px}
    .is-empty .welcome h1{max-width:290px;font-size:29px}
    .is-empty .welcome p{max-width:250px;line-height:1.7}

  }

  /* 统一到暖墨体系：字体 / 圆角 / 品牌 */
  body{font-family:var(--font-sans)}
  .brand{font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:.08em;gap:12px}
  .brand img{width:28px;height:28px}
  h1{font-family:var(--font-display);font-weight:400;font-size:34px;letter-spacing:.01em}
  .welcome h1,.is-empty .welcome h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4vw,40px);letter-spacing:.01em}
  .heading h1 em{margin-left:.14em}
  .is-empty .brand{font-size:19px}
  .askbar,.is-empty .askbar{border-radius:6px;box-shadow:none}
  .askbar:focus-within,.is-empty .askbar:focus-within{box-shadow:none}

</style>

<header>
  <a class="brand" href="index.html"><img src="assets/science-logo.png" alt="中国石油">油见未来</a>
  <nav>
<a href="index.html">首页</a>
<a href="ask.html" aria-current="page">智能问答</a>

<main>
  <div class="welcome">
    <div class="welcome-mark"><svg viewBox="0 0 52 64" fill="none" aria-hidden="true">
      <defs><clipPath id="drop"><path d="M27 2C22 15 5 29 5 42a21 21 0 0 0 42 0C47 29 34 13 27 2Z"/></clipPath></defs>
      <g clip-path="url(#drop)"><path fill="currentColor" d="M0 0h52v64H0z"/>
        <path d="M-2 38q13 10 27 0t29-2M-2 45q13 10 27 0t29-2M-2 52q13 10 27 0t29-2" stroke="var(--bg)" stroke-width="2.6"/>
      </g>
    </svg></div>
    <span class="eyebrow">石油科普 · 问答</span>
    <h1>从一个问题<br>认识石油的世界</h1>
    <p>从地下岩层到日常生活，把好奇变成了解。</p>
    <img class="strata" src="assets/science-logo.png" alt="" aria-hidden="true">
  </div>
  <div class="heading">
    <h1>问一句<em>讲清楚</em></h1>
    <button class="new-chat" id="new-chat" type="button"><span class="new-chat__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7"/><path d="m11 13 8-8a2 2 0 0 1 3 3l-8 8-4 1z"/></svg></span><span>新对话</span></button>
  </div>
  <p class="sub">探索石油知识，从一个问题开始</p>

  <div id="out" role="log" aria-label="问答记录"></div>

  <div class="composer" id="composer">
    <form class="askbar" id="ask-form">
      <textarea id="q" name="question" rows="1" placeholder="关于石油，你想知道什么？" aria-label="输入石油科普问题" maxlength="300" required></textarea>
      <span class="composer-mode" title="自动匹配科普资料">自动</span>
      <span class="composer-note">石油科普问答</span>
      <button id="send" type="submit" aria-label="发送问题"><span class="send-label">发送</span><svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button>
    </form>
    <p class="hintbox">内容仅供科普参考。 <a href="kb.html">查看石油知识库 ↗</a></p>
  </div>
  <section class="explore" aria-labelledby="explore-title">
    <h2 id="explore-title">从现场开始探索</h2>
    <div class="field-stories">
      <button class="field-story" type="button" style="--photo:url('assets/core-rock.jpg')" data-question="看一段岩心，怎么判断岩石里能不能藏油？"><small>地下勘探</small><strong>一段岩心，怎么看出油藏？</strong><span>从岩石的孔隙问起 ↗</span></button>
      <button class="field-story" type="button" style="--photo:url('assets/reservoir-lab.jpg')" data-question="实验室怎么测出原油有多稠，黏度又怎样影响开采？"><small>油藏实验室</small><strong>同样是原油，为什么有稀有稠？</strong><span>看看黏度怎样影响开采 ↗</span></button>
    </div>
  </section>
  <h2 class="suggestion-title">不知道从哪里开始？试试这些问题</h2>
  <div class="chips" id="chips"></div>
</main>

<script src="assets/vendor/marked.umd.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script>
(function () {
  const $ = selector => document.querySelector(selector);
  const questionInput = $('#q');
  const sendButton = $('#send');
  const output = $('#out');
  const chips = $('#chips');
  const initialPlaceholder = questionInput.placeholder;
  let pending = null;
  let conversationId = '';
  let userId = crypto.randomUUID();
  const examples = [
    { question:'石油为什么是黑色的', keys:/黑色|颜色/, title:'石油为什么通常是黑色的？', intro:'石油并不都是黑色的。它的颜色可以从浅黄、棕褐到深黑，主要取决于其中不同成分的比例。', points:['原油由多种烃类和少量其他物质组成，成分不同，外观也会不同。','较重的组分以及胶质、沥青质含量较高时，原油往往颜色更深。','颜色较浅的原油通常含有较多轻质组分，但不能仅凭颜色判断品质。'], summary:'简单说，石油的颜色是多种成分共同作用的结果。' },
    { question:'为什么油藏在石头里', keys:/石头|岩石|油藏|岩心/, title:'油为什么能藏在石头里？', intro:'地下的石油通常不是聚集在巨大的空洞中，而是存在于储层岩石的微小孔隙里。', points:['砂岩等储层岩石内部有许多细小孔隙，像海绵一样可以容纳流体。','孔隙相互连通时，油和气能够在一定条件下流动。','上方的致密盖层可以阻挡油气继续向上运移，帮助形成油藏。'], summary:'理解油藏的关键，是岩石的孔隙、连通性和封闭条件。' },
    { question:'浮顶罐为什么能防蒸发', keys:/浮顶罐|蒸发|储罐/, title:'浮顶罐如何减少油品蒸发？', intro:'浮顶罐的顶部浮在液面上，并随着液位升降，从而减少油品与上方空气接触的空间。', points:['浮顶随液面移动，缩小了油面上方的气体空间。','浮顶边缘设有密封装置，有助于减少油气从边缘逸出。','它能降低蒸发损耗，但并不能让蒸发完全消失。'], summary:'浮顶罐的作用，是通过减少气体空间和加强密封来降低损耗。' },
    { question:'汽油和柴油差在哪', keys:/汽油|柴油/, title:'汽油和柴油有什么区别？', intro:'汽油和柴油都是石油加工产品，但它们的组分、挥发性和常见用途不同。', points:['汽油相对更容易挥发，常用于火花点火式发动机。','柴油通常较不易挥发，常用于压燃式发动机。','两种燃料的使用要求不同，应按车辆或设备规定加注。'], summary:'选择燃料要看发动机要求，不能互相替代。' },
    { question:'石油能做衣服吗', keys:/衣服|纤维|衣物|塑料/, title:'石油能做成衣服吗？', intro:'石油不会直接变成衣服，但它可以提供制造某些合成纤维的原料。', points:['石油经过炼制和化工加工，可得到制造合成材料所需的基础原料。','涤纶、锦纶等合成纤维可以加工成面料，用于服装和日常用品。','一件衣服也可能由合成纤维与棉、羊毛等天然纤维混纺制成。'], summary:'从石油到衣服，中间需要经过炼化、聚合、纺丝和织造等步骤。' },
    { question:'为什么有的油稠有的稀', keys:/稠|黏|粘|原油/, title:'为什么有的原油稠，有的原油稀？', intro:'原油的稀稠与组成和温度有关，通常可以用黏度来描述它流动时的阻力。', points:['原油中重质组分的比例不同，流动性也会不同。','温度会影响黏度：同一种原油在较低温度下往往更难流动。','原油黏度会影响输送和开采方式，实际工程需要结合油藏条件评估。'], summary:'原油稀稠并非只由一个因素决定，成分和温度都很重要。' }
  ];
  const shortcutIcons = [
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-2.7 4-6 7.3-6 11a6 6 0 0 0 12 0c0-3.7-3.3-7-6-11Z"/><path d="M9 15a3 3 0 0 0 3 3"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 5-8 4 4 3-6 6 10Z"/><path d="M3 20h18"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V5h10v16M3 21h15M7 5V3h6v2M8 8h4M8 11h4"/><path d="M15 8h2l2 2v8a2 2 0 0 0 4 0v-6l-3-3"/></svg>'
  ];
  [examples[0], examples[1], examples[3]].forEach((example, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.innerHTML = shortcutIcons[index];
    const label = document.createElement('span');
    label.className = 'shortcut-question';
    label.textContent = example.question;
    const category = document.createElement('span');
    category.className = 'shortcut-label';
    category.textContent = ['认识原油', '走进地下', '能源与生活'][index];
    button.append(category, label);
    button.addEventListener('click', () => ask(example.question));
    chips.appendChild(button);
  });
  function node(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text) el.textContent = text;
    return el;
  }
  function answerFor(question) {
    return examples.find(item => item.question === question || item.keys.test(question)) || {
      title:'这是一个值得探索的问题',
      intro:'暂时没有找到这个问题的相关内容。',
      points:['可以试试询问石油的颜色、油藏、浮顶罐、汽油与柴油、合成纤维或原油黏度。'],
      summary:'也可以从推荐问题开始探索。'
    };
  }
  function renderAnswer(content, text) {
    // 流式输出尚未闭合的加粗标记时，也按加粗显示。
    const lastLine = text.slice(text.lastIndexOf('\n') + 1);
    if ((lastLine.match(/\*\*/g) || []).length % 2) text += text.endsWith('*') && !text.endsWith('**') ? '*' : '**';
    else if (text.endsWith('*') && !text.endsWith('**')) text = text.slice(0, -1);
    content.innerHTML = DOMPurify.sanitize(marked.parse(text));
  }
  function createUserMessage(question, prompt, turn) {
    const wrapper = node('div', 'user-message');
    const actions = node('div', 'user-actions');
    actions.setAttribute('role', 'group');
    actions.setAttribute('aria-label', '消息操作');
    const time = node('time', '', new Intl.DateTimeFormat('zh-CN', { hour:'2-digit', minute:'2-digit', hour12:false }).format(new Date()));
    const copy = node('button', 'message-action');
    copy.type = 'button';
    copy.title = '复制';
    copy.setAttribute('aria-label', '复制消息');
    copy.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    copy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(question);
        copy.title = '已复制';
        copy.setAttribute('aria-label', '已复制');
        setTimeout(() => { copy.title = '复制'; copy.setAttribute('aria-label', '复制消息'); }, 1800);
      } catch { copy.title = '复制失败'; copy.setAttribute('aria-label', '复制失败'); }
    });
    const edit = node('button', 'message-action');
    edit.type = 'button';
    edit.title = '编辑';
    edit.setAttribute('aria-label', '编辑消息');
    edit.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>';
    edit.addEventListener('click', () => {
      if (pending || wrapper.querySelector('.edit-message')) return;
      const form = node('form', 'edit-message');
      const input = node('textarea');
      input.value = question;
      input.maxLength = 300;
      input.setAttribute('aria-label', '编辑问题');
      const controls = node('div', 'edit-actions');
      const cancel = node('button', '', '取消');
      cancel.type = 'button';
      const save = node('button', 'edit-save', '保存并重新提问');
      save.type = 'submit';
      const update = () => { save.disabled = !input.value.trim() || input.value.trim() === question; };
      input.addEventListener('input', update);
      cancel.addEventListener('click', () => { form.replaceWith(prompt); actions.hidden = false; edit.focus(); });
      form.addEventListener('submit', event => {
        event.preventDefault();
        const value = input.value.trim();
        if (!value || value === question || pending) return;
        conversationId = '';
        userId = crypto.randomUUID();
        let next = turn;
        while (next) { const following = next.nextElementSibling; next.remove(); next = following; }
        ask(value);
      });
      update();
      controls.append(cancel, save);
      form.append(input, controls);
      prompt.replaceWith(form);
      actions.hidden = true;
      input.focus();
    });
    actions.append(time, copy, edit);
    wrapper.append(prompt, actions);
    return wrapper;
  }
  async function ask(value, existingTurn = null) {
    const question = value.trim().slice(0, 300);
    if (!question || pending) return;
    if (document.body.classList.contains('is-empty')) {
      document.body.classList.remove('is-empty');
      output.before(chips);
    }
    sendButton.disabled = true;
    if (!existingTurn) {
      questionInput.value = '';
      resizeInput();
      questionInput.focus({ preventScroll:true });
    }
    const turn = existingTurn || node('article');
    const answer = existingTurn ? turn.querySelector('.ans') : node('div', 'ans');
    const loading = node('div', 'loading', '正在组织回答…');
    answer.replaceChildren(loading);
    if (!existingTurn) {
      const prompt = node('p', 'turn__q', question);
      turn.append(createUserMessage(question, prompt, turn), answer);
      output.append(turn);
      window.scrollTo({ top:document.documentElement.scrollHeight });
    }
    const request = { controller:new AbortController() };
    pending = request;
    const content = node('div', 'ans__t');
    let text = '';
    let rawText = '';
    try {
      const response = await fetch('/api/dify-chat', {
        method:'POST', headers:{ 'Content-Type':'application/json' }, signal:request.controller.signal,
        body:JSON.stringify({ question, conversation_id:conversationId, user:userId })
      });
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.error || '请求失败，请稍后重试');
      }
      if (!response.body) throw new Error('浏览器不支持流式响应');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let completed = false;
      while (true) {
        const part = await reader.read();
        buffer += decoder.decode(part.value || new Uint8Array(), { stream:!part.done });
        const events = buffer.split(/\r?\n\r?\n/);
        buffer = events.pop();
        for (const event of events) {
          const data = event.split(/\r?\n/).filter(line => line.startsWith('data:')).map(line => line.slice(5).trimStart()).join('\n');
          if (!data) continue;
          let message;
          try { message = JSON.parse(data); } catch { continue; }
          if (message.event === 'error') throw new Error(message.message || '回答生成失败');
          if (message.event === 'message' || message.event === 'agent_message') {
            if (message.conversation_id) conversationId = message.conversation_id;
            if (typeof message.answer === 'string') {
              const followScroll = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 300;
              rawText += message.answer;
              text = rawText.replace(/<think\b[^>]*>[\s\S]*?<\/think\s*>/gi, '')
                .replace(/<think\b[^>]*>[\s\S]*$/i, '')
                .replace(/<\/think\s*>/gi, '')
                .replace(/<think\b[^>]*$/i, '')
                .replace(/<\/?t(?:h(?:i(?:n(?:k)?)?)?)?$/i, '');
              if (text.trim()) {
                if (!content.isConnected) answer.replaceChildren(content);
                renderAnswer(content, text.trimStart());
              }
              if (followScroll) window.scrollTo({ top:document.documentElement.scrollHeight });
            }
          }
          if (message.event === 'message_end') completed = true;
        }
        if (part.done) break;
      }
      if (!completed) throw new Error('回答中断，请重试');
      if (!text) throw new Error('没有收到回答，请重试');
        const actions = node('div', 'answer-actions');
        actions.setAttribute('role', 'group');
        actions.setAttribute('aria-label', '回答操作');
        const copy = node('button', 'message-action');
        copy.type = 'button';
        copy.title = '复制';
        copy.setAttribute('aria-label', '复制回答');
        copy.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(content.innerText);
            copy.title = '已复制';
            copy.setAttribute('aria-label', '已复制');
            setTimeout(() => { copy.title = '复制'; copy.setAttribute('aria-label', '复制回答'); }, 1800);
          } catch { copy.title = '复制失败'; copy.setAttribute('aria-label', '复制失败'); }
        });
        const retry = node('button', 'message-action');
        retry.type = 'button';
        retry.title = '重新生成';
        retry.setAttribute('aria-label', '重新生成回答');
        retry.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4v5h-5M4 20v-5h5"/><path d="M5 9a8 8 0 0 1 13-3l2 3M19 15a8 8 0 0 1-13 3l-2-3"/></svg>';
        retry.addEventListener('click', () => { if (!pending) { conversationId = ''; userId = crypto.randomUUID(); let next = turn.nextElementSibling; while (next) { const following = next.nextElementSibling; next.remove(); next = following; } ask(question, turn); } });
        actions.append(copy, retry);
        answer.append(actions);
    } catch (error) {
      if (error.name !== 'AbortError' && pending === request) {
        content.textContent = (text ? text + '\n\n' : '') + (error.message || '回答失败，请稍后重试');
        answer.replaceChildren(content);
      }
    } finally {
      if (pending === request) {
        pending = null;
        sendButton.disabled = false;
        questionInput.placeholder = '继续追问…';
      }
    }
  }
  function resizeInput() {
    questionInput.style.height = 'auto';
    questionInput.style.height = Math.min(questionInput.scrollHeight, 160) + 'px';
  }
  questionInput.addEventListener('input', resizeInput);
  questionInput.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      $('#ask-form').requestSubmit();
    }
  });
  const initialQuestion = new URLSearchParams(location.search).get('q');
  if (initialQuestion) {
    questionInput.value = initialQuestion.slice(0, 300);
    resizeInput();
    questionInput.focus({ preventScroll:true });
  }
  $('#ask-form').addEventListener('submit', event => { event.preventDefault(); ask(questionInput.value); });
  $('#new-chat').addEventListener('click', () => {
    if (pending) pending.controller.abort();
    conversationId = '';
    userId = crypto.randomUUID();
    pending = null;
    output.replaceChildren();
    document.body.classList.add('is-empty');
    $('.suggestion-title').after(chips);
    sendButton.disabled = false;
    questionInput.value = '';
    questionInput.placeholder = initialPlaceholder;
    resizeInput();
    questionInput.focus();
  });
})();
</script>
</body>
</html>
