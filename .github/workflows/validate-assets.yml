name: validate-assets

# 资产契约门禁：Manifest Schema、nodeUid 唯一性、ID 引用完整性、GLB 一致性。
# 只在资产/契约相关文件变化时触发，避免无关提交被阻塞。
on:
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'tools/validate_assets.mjs'
      - 'tools/gen_pilot_separator_manifest.mjs'
      - 'tools/blender/**'
      - 'web/assets/**/*.manifest.json'
      - 'web/assets/**/*.glb'
      - 'tests/fixtures/asset-manifests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-assets.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'tools/validate_assets.mjs'
      - 'web/assets/**/*.manifest.json'
      - 'web/assets/**/*.glb'
      - 'tests/fixtures/asset-manifests/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖（仅 devDependencies：ajv / ajv-formats）
        run: npm ci

      - name: 校验器自测（应按期望通过/失败）
        run: npm run validate:assets:fixtures

      - name: 校验真实 Manifest（Schema + 引用 + GLB 一致性）
        run: npm run validate:assets

      # 2026-11-27：separator 发布产物已回写 extras.petro（43/43，extrasStatus=verified），
      # strict 步骤正式启用。新增资产在 extras 未闭环前必须标 pending_rebuild 并知悉本步骤会红。
      - name: 严格模式（要求 extras.petro 已回写）
        run: npm run validate:assets:strict

      - name: 工艺连接（开发态：结构/引用/几何/依据字段合法性）
        run: npm run validate:connections

  # 生产工艺连接门禁（发布用，与日常 validate 分开）。
  #
  # 为什么不并进 validate：push 不等于「正式发布」。当前连接是 draft + pendingBasis，
  # 并进 validate 会让每次提交常年红，红色一旦变成常态就没人看了。
  # 真正的发布动作（手动触发 / 打 tag）才必须过这道门，且它是硬失败：
  # 2026-11-27 起 validate:connections:strict 对任何非 approved / pendingBasis 连接 exit 1，
  # 不再是「打印一句 BLOCKED 然后成功退出」。
  publish-gate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: 生产工艺连接门禁（非 approved 即失败）
        run: npm run validate:connections:strict

